root = "."
tmp_dir = "tmp"

[build]
    cmd = "go build -buildvcs=false -o ./tmp/main ./cmd/api"
    bin = "./tmp/main"
    delay = 1000
    exclude_dir = ["tmp", "web"]
    include_ext = ["go"]
    kill_delay = "500ms"
    send_interrupt = true
    stop_on_error = true

[log]
    time = true

[misc]
    clean_on_exit = true